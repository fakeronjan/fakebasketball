<!doctype html><meta charset="utf-8">
<style>
@font-face { font-family: CM; src: url(fonts/cascadia-mono-latin-400-normal.woff2); font-weight: 400; }
@font-face { font-family: CM; src: url(fonts/cascadia-mono-latin-700-normal.woff2); font-weight: 700; }
html, body { margin: 0; background: #000; }
canvas { display: block; }
</style>
<canvas id="c"></canvas>
<script>
const P = new URLSearchParams(location.search);
const D = P.get('d'), W = +P.get('w'), H = +P.get('h'), NOTEXT = P.has('notext');
const c = document.getElementById('c'); c.width = W; c.height = H;
const g = c.getContext('2d');
const BG = '#141414', GOLD = '#f0a030', CURSOR = '#e8c56d', FG = '#ececec';

function ball(x, y, r, ctx = g, outline = BG) {
  const gr = ctx.createRadialGradient(x - r * .3, y - r * .35, r * .1, x, y, r * 1.05);
  gr.addColorStop(0, '#f29a4a'); gr.addColorStop(.7, '#d9742a'); gr.addColorStop(1, '#b85a1c');
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = gr; ctx.fill(); ctx.clip();
  ctx.strokeStyle = outline; ctx.lineWidth = r * .067; ctx.lineCap = 'round';
  const L = (a, b, c2, d) => { ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c2, d); ctx.stroke(); };
  L(x, y - r, x, y + r); L(x - r, y, x + r, y);
  ctx.beginPath(); ctx.moveTo(x - r * .67, y - r * .85); ctx.bezierCurveTo(x - r * .34, y - r * .46, x - r * .34, y + r * .46, x - r * .67, y + r * .85); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + r * .67, y - r * .85); ctx.bezierCurveTo(x + r * .34, y - r * .46, x + r * .34, y + r * .46, x + r * .67, y + r * .85); ctx.stroke();
  ctx.restore();
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.strokeStyle = outline; ctx.lineWidth = r * .03; ctx.stroke();
}

// Fit title lines into a box; returns font size
function fitTitle(lines, maxW, maxH, weight = 700) {
  let s = 400;
  for (; s > 8; s -= 2) {
    g.font = `${weight} ${s}px CM`;
    const w = Math.max(...lines.map(l => g.measureText(l).width));
    if (w <= maxW && s * 1.05 * lines.length <= maxH) break;
  }
  return s;
}
function title(lines, x, y, maxW, maxH, align = 'left', color = FG, cursor = true) {
  const s = fitTitle(lines.map((l, i) => i === lines.length - 1 && cursor ? l + '█' : l), maxW, maxH);
  g.font = `700 ${s}px CM`; g.textBaseline = 'alphabetic'; g.fillStyle = color;
  const lh = s * 1.05, total = lh * lines.length;
  let yy = y - total / 2 + s * .82;
  lines.forEach((l, i) => {
    const full = l + (i === lines.length - 1 && cursor ? '█' : '');
    const w = g.measureText(full).width;
    const xx = align === 'center' ? x - w / 2 : x;
    g.fillStyle = color; g.fillText(l, xx, yy);
    if (i === lines.length - 1 && cursor) { const lw = g.measureText(l).width; const cw = g.measureText('█').width;
      g.fillStyle = CURSOR; g.fillRect(xx + lw + cw * .12, yy - s * .74, cw * .62, s * .86); }
    yy += lh;
  });
}

const STAND = [
  ' #  Team                      W-L     %   PS/G   PA/G   Diff  Top Scorer',
  ' 1. Los Angeles Palms        64-26   71%  101.9   94.4   +7.5  Rin George-Casworth 24.3',
  ' 2. Atlanta Magnolias        62-28   69%   99.9   92.8   +7.1  Lance Morgan 23.9',
  ' 3. Dallas Rattlers          61-29   68%  102.2   93.0   +9.2  Braian Morales-Wynnard 28.0',
  ' 4. Philadelphia Fighters    59-31   66%  102.1   97.4   +4.7  Tanisha Diallnguez 25.8',
  ' 5. Boston Common            56-34   62%   99.3   94.2   +5.1  Diana Oseiworth 28.0',
  ' 6. Los Angeles Hollywood    53-37   59%   99.4   94.7   +4.8  Courtney Lee-Volzton 28.8',
  ' 7. Washington Sentinels     52-38   58%   98.4   95.7   +2.8  Jun Koffez 28.4',
  ' 8. Seattle Emeralds         45-45   50%   95.7   96.9   -1.2  Tyler Gilmore 27.8',
  ' 9. Washington Diplomats     42-48   47%   94.5   93.8   +0.7  Endy Jordan 25.9',
  '10. Houston Orbiters         41-49   46%   94.9   95.7   -0.9  Ivory Evans 30.5',
  '11. Dallas Roughnecks        36-54   40%   90.9   94.8   -3.9  Valentina Torres-Colmr 22.4',
  '12. Atlanta Crimson          34-56   38%   91.9   96.5   -4.6  Cierra Asantaylo 21.2',
  '13. Chicago Foxes            33-57   37%   91.1   96.2   -5.1  Cynthia Phelpombe 21.1',
  '14. Miami Surge              30-60   33%   89.8   97.0   -7.2  DeAndre Oseiade 24.3',
  '15. Miami Barracudas         28-62   31%   90.0   98.3   -8.3  Chauncey Straxez 21.5',
  '16. New York Skyliners       24-66   27%   84.6   95.2  -10.5  Luguentz Vargas 21.9',
  '',
  ' SCANDAL - FINANCIAL FRAUD ALLEGATION       [1] Force immediate sale   [2] Suspend pending review',
  ' RIVAL LEAGUE  Continental Basketball Circuit (CBC)   Strength: Dominant (100%)',
  ' COMMISSIONER\'S DESK   Popularity 80%   Treasury $329M   Legitimacy 86%',
  ' AWARDS NIGHT   MVP Braian Morales-Wynnard  28.0 PPG  10.1 RPG   3x  3 in a row',
];

function termBackdrop(alpha, size) {
  g.font = `400 ${size}px CM`; g.textBaseline = 'top';
  const lh = size * 1.35; let y = -size * .2, i = 0;
  while (y < H) {
    const l = STAND[i % STAND.length];
    const cols = ['#d8d8d8', '#6fbf73', '#e06c6c', GOLD];
    g.fillStyle = `rgba(216,216,216,${alpha})`;
    g.fillText(l + '      ' + STAND[(i + 7) % STAND.length], size * .6, y);
    y += lh; i++;
  }
}
function pool(cx, cy, rx, ry) {
  g.save(); g.translate(cx, cy); g.scale(1, ry / rx);
  const gr = g.createRadialGradient(0, 0, 0, 0, 0, rx);
  gr.addColorStop(0, 'rgba(20,20,20,.97)'); gr.addColorStop(.65, 'rgba(20,20,20,.9)'); gr.addColorStop(1, 'rgba(20,20,20,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(0, 0, rx, 0, 7); g.fill(); g.restore();
}
function vignette(strength = .85) {
  const gr = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .2, W / 2, H / 2, Math.max(W, H) * .75);
  gr.addColorStop(0, 'rgba(20,20,20,0)'); gr.addColorStop(1, `rgba(20,20,20,${strength})`);
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
}

// ── A: Terminal ───────────────────────────────────────────────────────────
function A() {
  if (P.has('logo')) {   // transparent: ball + title only, laid over the library hero
    title(['FAKE', 'BASKETBALL'], 4, H / 2, W - 8, H * .96);
    return;
  }
  if (P.has('hero')) {   // artwork only, no title; Steam places the logo on top
    g.fillStyle = BG; g.fillRect(0, 0, W, H);
    termBackdrop(.10, Math.round(H / 38));
    vignette(.75);
    pool(W * .2, H / 2, W * .2, H * .42);   // calm area where the logo usually sits
    const r = H * .27; pool(W * .64, H / 2, r * 2.2, r * 1.6); ball(W * .64, H / 2, r);
    return;
  }
  g.fillStyle = BG; g.fillRect(0, 0, W, H);
  termBackdrop(.10, Math.max(11, Math.round(Math.min(W, H) / 26)));
  vignette(.7);
  const land = W / H > 1.2;
  if (NOTEXT) { ball(W * .5, H * .5, Math.min(W, H) * .32); return; }
  if (land) {
    const r = H * .3; ball(W * .06 + r, H / 2, r);
    const x0 = W * .06 + 2 * r + W * .05;
    pool(x0 + (W - x0) / 2, H / 2, (W - x0) * .62, H * .5);
    title(['FAKE', 'BASKETBALL'], x0, H / 2, W - x0 - W * .05, H * .7);
  } else {
    pool(W / 2, H * .72, W * .62, H * .2);
    const r = W * .27; ball(W / 2, H * .32, r);
    title(['FAKE', 'BASKETBALL'], W / 2, H * .72, W * .86, H * .3, 'center');
  }
}

// ── B: LED scoreboard ─────────────────────────────────────────────────────
const FONT57 = {
  F: ['11111','10000','10000','11110','10000','10000','10000'],
  A: ['01110','10001','10001','11111','10001','10001','10001'],
  K: ['10001','10010','10100','11000','10100','10010','10001'],
  E: ['11111','10000','10000','11110','10000','10000','11111'],
  B: ['11110','10001','10001','11110','10001','10001','11110'],
  S: ['01111','10000','10000','01110','00001','00001','11110'],
  T: ['11111','00100','00100','00100','00100','00100','00100'],
  L: ['10000','10000','10000','10000','10000','10000','11111'],
};
// Light dots on the board grid. (gx, gy) = top-left cell of the text block.
function ledText(lines, cx, cy, maxW, maxH, pitch) {
  const lineCols = lines.map(l => l.length * 6 - 1), cols = Math.max(...lineCols);
  const rows = lines.length * 7 + (lines.length - 1) * 3;
  const gx = Math.round((cx - cols * pitch / 2) / pitch), gy = Math.round((cy - rows * pitch / 2) / pitch);
  lines.forEach((l, li) => {
    const ox = gx + Math.round((cols - lineCols[li]) / 2), oy = gy + li * 10;
    [...l].forEach((chr, ci) => FONT57[chr].forEach((row, ry) => [...row].forEach((bit, rx) => {
      if (bit !== '1') return;
      const x = (ox + ci * 6 + rx) * pitch + pitch / 2, y = (oy + ry) * pitch + pitch / 2;
      g.beginPath(); g.arc(x, y, pitch * .4, 0, 7); g.fillStyle = GOLD;
      g.shadowColor = 'rgba(240,160,48,.6)'; g.shadowBlur = pitch * 1.1; g.fill(); g.shadowBlur = 0;
    })));
  });
}
function B() {
  g.fillStyle = '#0b0b0b'; g.fillRect(0, 0, W, H);
  const land0 = W / H > 1.2;
  const pitch = Math.max(3, Math.floor(land0 ? (W - W * .09 - H * .6 - W * .06) / 59 : (W * .88) / 59));
  // dim dot field everywhere
  for (let y = pitch / 2; y < H; y += pitch) for (let x = pitch / 2; x < W; x += pitch) { g.beginPath(); g.arc(x, y, pitch * .32, 0, 7); g.fillStyle = '#17120a'; g.fill(); }
  if (NOTEXT) { ball(W / 2, H / 2, Math.min(W, H) * .3, g, '#0b0b0b'); return; }
  const land = W / H > 1.2;
  if (land) {
    const r = H * .3; ball(W * .06 + r, H / 2, r, g, '#0b0b0b');
    const x0 = W * .06 + 2 * r + W * .03;
    ledText(['FAKE', 'BASKETBALL'], x0 + (W - x0 - W * .04) / 2, H / 2, W - x0 - W * .04, H * .78, pitch);
  } else {
    const r = W * .26; ball(W / 2, H * .3, r, g, '#0b0b0b');
    ledText(['FAKE', 'BASKETBALL'], W / 2, H * .72, W * .9, H * .4, pitch);
  }
}

// ── C: ASCII court ────────────────────────────────────────────────────────
function C() {
  g.fillStyle = BG; g.fillRect(0, 0, W, H);
  const off = document.createElement('canvas'); off.width = W; off.height = H; const o = off.getContext('2d');
  o.strokeStyle = '#fff'; o.lineWidth = Math.max(3, Math.min(W, H) * .012);
  const land = W / H > 1.2;
  // full court, landscape or rotated
  o.save();
  if (!land) { o.translate(W, 0); o.rotate(Math.PI / 2); }
  const cw = land ? W : H, ch = land ? H : W, m = Math.min(cw, ch) * .07;
  o.strokeRect(m, m, cw - 2 * m, ch - 2 * m);
  o.beginPath(); o.moveTo(cw / 2, m); o.lineTo(cw / 2, ch - m); o.stroke();
  o.beginPath(); o.arc(cw / 2, ch / 2, ch * .14, 0, 7); o.stroke();
  const keyW = cw * .18, keyH = ch * .3;
  o.strokeRect(m, ch / 2 - keyH / 2, keyW, keyH); o.strokeRect(cw - m - keyW, ch / 2 - keyH / 2, keyW, keyH);
  o.beginPath(); o.arc(m + keyW, ch / 2, keyH / 2, -Math.PI / 2, Math.PI / 2); o.stroke();
  o.beginPath(); o.arc(cw - m - keyW, ch / 2, keyH / 2, Math.PI / 2, Math.PI * 1.5); o.stroke();
  o.beginPath(); o.arc(m + cw * .05, ch / 2, ch * .42, -Math.PI / 2.35, Math.PI / 2.35); o.stroke();
  o.beginPath(); o.arc(cw - m - cw * .05, ch / 2, ch * .42, Math.PI - Math.PI / 2.35, Math.PI + Math.PI / 2.35); o.stroke();
  o.restore();
  const d = o.getImageData(0, 0, W, H).data;
  const fs = Math.max(9, Math.round(Math.min(W, H) / 34)); g.font = `400 ${fs}px CM`; const chw = g.measureText('M').width, lh = fs * 1.15;
  g.textBaseline = 'top';
  for (let y = 0; y < H; y += lh) for (let x = 0; x < W; x += chw) {
    let a = 0; for (let yy = 0; yy < lh; yy += 3) for (let xx = 0; xx < chw; xx += 2) { const px = Math.floor(x + xx), py = Math.floor(y + yy); if (px < W && py < H) a += d[(py * W + px) * 4 + 3]; }
    const ch_ = a > 9000 ? '#' : a > 3500 ? '+' : a > 800 ? ':' : '.';
    g.fillStyle = ch_ === '.' ? 'rgba(240,160,48,.06)' : 'rgba(240,160,48,.8)';
    g.fillText(ch_, x, y);
  }
  vignette(.35);
  if (NOTEXT) { ball(W / 2, H / 2, Math.min(W, H) * .2); return; }
  if (land) {
    g.fillStyle = 'rgba(20,20,20,.88)'; g.fillRect(0, H * .3, W, H * .4);
    const r = H * .15; ball(W * .1 + r, H / 2, r);
    const x0 = W * .1 + 2 * r + W * .04;
    title(['FAKE BASKETBALL'], x0, H / 2, W - x0 - W * .06, H * .3);
  } else {
    g.fillStyle = 'rgba(20,20,20,.88)'; g.fillRect(0, H * .56, W, H * .3);
    ball(W / 2, H * .33, W * .2);
    title(['FAKE', 'BASKETBALL'], W / 2, H * .71, W * .86, H * .25, 'center');
  }
}

document.fonts.load('700 40px CM').then(() => document.fonts.load('400 20px CM')).then(() => { ({ A, B, C })[D](); document.title = 'done'; });
</script>
